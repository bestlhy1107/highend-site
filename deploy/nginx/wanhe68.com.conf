server {
    listen 80;
    server_name wanhe68.com www.wanhe68.com;
    return 301 https://www.wanhe68.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wanhe68.com;

    ssl_certificate     /www/server/nginx/ssl/wanhe68.com/fullchain.pem;
    ssl_certificate_key /www/server/nginx/ssl/wanhe68.com/privkey.pem;

    return 301 https://www.wanhe68.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.wanhe68.com;

    ssl_certificate     /www/server/nginx/ssl/wanhe68.com/fullchain.pem;
    ssl_certificate_key /www/server/nginx/ssl/wanhe68.com/privkey.pem;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /_astro/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
