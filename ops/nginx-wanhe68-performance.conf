# Wanhe Education Nginx performance snippet
#
# 放置位置：
# - 放到 www.wanhe68.com 对应 Nginx server {} 块内部。
# - 如果使用宝塔面板，可放到站点配置的 server {} 内，保存后执行 nginx -t，再重载 Nginx。
#
# 目标：
# - /_astro/ 静态构建资源由 Nginx 直出并长缓存。
# - /api/uploads/ 上传图片由 Nginx 直出，避免每张图片都进入 Node/Astro。
# - 图片保持原图清晰，不做压缩、不做缩放、不做 image_filter。
#
# 当前默认上传目录：
#   /root/highend-site/public/uploads/
#
# 如果之后在 .env 设置独立持久目录：
#   UPLOAD_ROOT=/root/highend-runtime/uploads
# 则把下面 /api/uploads/ 的 alias 改成：
#   alias /root/highend-runtime/uploads/;

location ^~ /_astro/ {
    alias /root/highend-site/dist/client/_astro/;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Wanhe-Static "astro-nginx" always;
    try_files $uri =404;
}

location ^~ /api/uploads/ {
    alias /root/highend-site/public/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Wanhe-Static "uploads-nginx" always;
    try_files $uri =404;
}

# 其余请求继续交给 Astro SSR 服务。
location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
